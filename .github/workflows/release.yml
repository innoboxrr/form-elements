name: Release

# Se dispara solo si los tests pasaron: workflow_run sobre 'Tests'. La version
# la declara package.json y el tag se deriva de ella.
on:
    workflow_run:
        workflows: ['Tests']
        types: [completed]
        branches: [master]
    workflow_dispatch:

jobs:
    release:
        uses: innoboxrr/.github/.github/workflows/node-release.yml@main
        secrets: inherit
