name: Tests

on:
    push:
        branches: [master]
    pull_request:

jobs:
    tests:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                node: ['20', '22', '24']

        name: Node ${{ matrix.node }}

        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node }}

            # Es una libreria, no una aplicacion: no se versiona el lockfile, y
            # asi la suite corre contra las dependencias que de verdad va a
            # resolver quien la instale.
            - run: npm install --no-audit --no-fund

            - run: npm test
